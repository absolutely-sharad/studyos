name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL with the pgvector extension, which the first migration enables.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studyos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyos
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Apply migrations to an empty database
        run: npm run db:deploy
      - name: Fail if prisma/schema.prisma has changes without a migration
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Tests (unit and database)
        run: npm test
      - name: Build (no database or secrets needed)
        run: npm run build
        env:
          DATABASE_URL: ""
      - name: Dependency audit
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          cache-from: type=gha
